<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">
    <h1>📦 Gestión de Productos</h1>

    <!-- ALERTAS -->
    <div id="successAlert" class="alert success"></div>
    <div id="errorAlert" class="alert error"></div>

    <!-- FORMULARIO -->
    <form id="productForm" class="card">
      <h2>Agregar Producto</h2>

      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="number" id="precio" placeholder="Precio" required>
      <input type="number" id="stock" placeholder="Stock" required>

      <button type="submit" class="btn primary">Guardar</button>
    </form>

    <!-- BUSCADOR -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar producto...">
      <button id="btnSearch" class="btn">Buscar</button>
    </div>

    <!-- LOADING -->
    <div id="loadingIndicator" class="loading">Cargando...</div>

    <!-- TABLA -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
